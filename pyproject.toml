[project]
name = "resumedb"
version = "0.1.0"
description = "Local resume tailoring app - Python backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",  # imported directly by config.py and routes.py, not just via fastapi
    "uvicorn",  # the ASGI server `make dev` runs; never imported in app code
    "ruamel.yaml",
    "pypdf",
    "python-multipart",  # required by the /api/upload multipart form endpoints
]

# Optional Codex provider. The openai_codex SDK is imported lazily (see codex.py),
# so the default claude pipeline runs without it. Install separately to enable:
#   uv pip install openai_codex

[dependency-groups]
dev = [
    "pytest",
    "httpx",  # required by fastapi's TestClient; not imported in test code
    "pytest-asyncio>=1.4.0",  # drives the async turn tests via asyncio_mode below
]

[tool.uv]
package = false  # resumedb is run via --app-dir / conftest path insertion, not installed

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
